<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: a quiet page. Date line, the day's question set large in a serif, a hairline, then four destinations as a ruled list. */
:root {
  --bg: #f3f4f1;
  --ink: #181b1a;
  --muted: #6b716e;
  --rule: #d4d7d2;
  --accent: #8a6a3b;
  --font-display: "Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --font-body: "Jost", "Futura", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101312; --ink: #e9e6df; --muted: #9a9f9b; --rule: #2a2f2d; --accent: #c9a96e;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
main {
  max-width: 880px; margin: 0 auto; min-height: 100vh;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: clamp(48px, 12vh, 120px) 64px;
  display: flex; flex-direction: column; gap: clamp(48px, 9vh, 88px);
}
.eyebrow {
  font-size: 11.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 14px;
}
.eyebrow::after { content: ""; flex: 0 0 48px; height: 1px; background: var(--accent); }

.question { margin: 0; display: flex; flex-direction: column; gap: 22px; }
.question .label { font-size: 11.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); }
.question p {
  margin: 0; font-family: var(--font-display); font-weight: 500; font-style: italic;
  font-size: clamp(34px, 5.6vw, 58px); line-height: 1.12; letter-spacing: -0.005em;
  max-width: 20ch; text-wrap: balance;
}

nav ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; border-top: 1px solid var(--rule); }
nav li { border-bottom: 1px solid var(--rule); }
nav a {
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 16px;
  padding: 22px 0; color: inherit; text-decoration: none;
}
nav .kind { grid-column: 1 / -1; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
nav .name { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.1; }
nav .arrow { color: var(--accent); font-size: 18px; transition: transform .25s ease; }
nav .desc { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
nav a:hover .name { color: var(--accent); }
nav a:hover .arrow { transform: translate(3px, -3px); }
nav a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

footer { margin-top: auto; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

@media (max-width: 620px) {
  nav ul { grid-template-columns: 1fr; }
  nav .name { font-size: 26px; }
}
@media (prefers-reduced-motion: no-preference) {
  .question p { animation: rise .9s ease both; }
  @keyframes rise { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { nav .arrow { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="eyebrow" id="date">Today</div>

  <figure class="question" aria-label="Question for today">
    <span class="label">Question for today</span>
    <p id="question">What value or principle do you try to live by every day?</p>
  </figure>

  <nav aria-label="Destinations">
    <ul>
      <li><a href="https://claude.ai/artifact/FZ5HoMJnrXj291Zwj6goSX" target="_blank" rel="noopener">
        <span class="kind">Claude</span>
        <span class="name">Daily feed</span><span class="arrow" aria-hidden="true">↗</span>
        <span class="desc">Breakthroughs in geospatial models and new missions</span>
      </a></li>
      <li><a href="https://claude.ai/artifact/XBFhaJrSxiJhbPa3BPRu3w" target="_blank" rel="noopener">
        <span class="kind">Claude</span>
        <span class="name">Planner</span><span class="arrow" aria-hidden="true">↗</span>
        <span class="desc">Plans and schedule</span>
      </a></li>
      <li><a href="https://app.notion.com/p/pixxelspacetech/Ideas-3fea487e444b80ef956cf14fb93ff45c" target="_blank" rel="noopener">
        <span class="kind">Notion</span>
        <span class="name">Ideas</span><span class="arrow" aria-hidden="true">↗</span>
        <span class="desc">Ideas worth developing</span>
      </a></li>
      <li><a href="https://app.notion.com/p/pixxelspacetech/To-read-3fea487e444b80fda8ddd54b188d978e" target="_blank" rel="noopener">
        <span class="kind">Notion</span>
        <span class="name">To read</span><span class="arrow" aria-hidden="true">↗</span>
        <span class="desc">Papers and posts queued for reading</span>
      </a></li>
    </ul>
  </nav>

  <footer id="foot">Bengaluru</footer>
</main>
<script>
  // One question per day, same for everyone that day. Add or remove lines freely.
  const QUESTIONS = [
    "What value or principle do you try to live by every day?",
    "What is one thing you want to understand better by the end of this week?",
    "What would make today a good day, even if nothing else goes to plan?",
    "Which idea on your list excites you most right now, and why haven't you started it?",
    "What did you learn yesterday that you didn't know the day before?",
    "Who helped you recently, and have you told them?",
    "What problem would you work on if you knew you couldn't fail?",
    "What are you avoiding, and what is the smallest first step?",
    "What does doing your best work look like today?",
    "Which assumption in your current work deserves a second look?",
    "What would you tell yourself from a year ago?",
    "What are you grateful for this morning?",
    "What is one thing you can make simpler today?",
    "Where do you want to be in five years, and does today move you closer?",
    "What question would you most like answered by your research?",
    "What drains your energy, and what restores it?",
    "What is one habit you want to keep, and one you want to drop?",
    "Who do you admire, and what quality of theirs do you want to practise?",
    "What would you build if you had a free week?",
    "What does success mean to you, in your own words?",
    "What is something you changed your mind about recently?",
    "How can you help someone on your team today?",
    "What paper or idea has stayed with you the longest, and why?",
    "What small win from this week are you proud of?",
    "What do you want people to say about your work?",
    "What are you curious about that has nothing to do with work?",
    "If today had only one priority, what would it be?",
    "What scares you a little but would be worth trying?",
    "What did you do this week just for joy?",
    "What kind of impact do you want your work to have on the planet?"
  ];
  try {
    const tz = "Asia/Kolkata";
    const now = new Date();
    const iso = new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(now);
    document.getElementById("date").textContent =
      new Intl.DateTimeFormat("en-GB", { timeZone: tz, weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(now);
    const day = Math.floor(Date.parse(iso + "T00:00:00Z") / 86400000);
    document.getElementById("question").textContent = QUESTIONS[day % QUESTIONS.length];
    const hour = Number(new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "numeric", hourCycle: "h23" }).format(now));
    const part = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    document.getElementById("foot").textContent = part;
  } catch (e) {}
</script>
</body>
</html>
