<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: a quiet page. Greeting, then the verse set in a serif beside a cartoon and a small calendar, the destinations as a ruled list, and the day's question in small type at the bottom. */
:root {
  --bg: #f3f4f1;
  --ink: #181b1a;
  --muted: #6b716e;
  --rule: #d4d7d2;
  --accent: #8a6a3b;
  --font-display: "Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --font-body: "Jost", "Futura", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101312; --ink: #e9e6df; --muted: #9a9f9b; --rule: #2a2f2d; --accent: #c9a96e;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
main {
  max-width: 920px; margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: clamp(20px, 5vh, 48px) 20px;
  display: flex; flex-direction: column; gap: clamp(20px, 4vh, 40px);
}
.eyebrow {
  font-size: 11.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 14px;
}
.eyebrow::after { content: ""; flex: 0 0 48px; height: 1px; background: var(--accent); }

.cal { width: 168px; display: flex; flex-direction: column; gap: 3px; align-self: start; }
.cal-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--rule); padding-bottom: 3px; }
.cal-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.cal-nav { background: none; border: 0; color: var(--muted); font-size: 16px; line-height: 1; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; padding: 0; }
.cal-nav:hover { color: var(--accent); }
.cal-nav:focus-visible, .cal-today:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-variant-numeric: tabular-nums; }
#cal-dow span { font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 2px 0; }
#cal-days span { font-size: 10.5px; height: 19px; display: grid; place-items: center; }
#cal-days .out { color: var(--muted); opacity: .45; }
#cal-days .we { color: var(--muted); }
#cal-days .today { position: relative; color: var(--bg); font-weight: 500; z-index: 0; isolation: isolate; }
#cal-days .today::before { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); z-index: -1; }
.cal-today { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); font: 500 9.5px var(--font-body); letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; }
.verse { margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.verse blockquote { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.verse p {
  margin: 0; font-family: var(--font-display); font-weight: 500; font-style: italic;
  font-size: clamp(19px, 2.1vw, 26px); line-height: 1.28; letter-spacing: -0.005em;
}
.verse figcaption { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.question { margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; border-top: 1px solid var(--rule); padding-top: 12px; }
.question .label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
.question p { margin: 0; font-family: var(--font-display); font-style: italic; font-size: 17px; line-height: 1.35; color: var(--ink); }

.hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 28px; }
.toon-btn { order: -1; justify-self: start; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; color: inherit; border-radius: 12px; line-height: 0; }
.toon-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 6px; }
.toon { width: clamp(120px, 15vw, 160px); height: auto; overflow: visible; }
.toon[hidden] { display: none; }
.toon .land-fill { fill: var(--accent); fill-opacity: .55; }
.toon .ink { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.toon .body { fill: var(--bg); }
.toon .panel { fill: var(--accent); fill-opacity: .22; }
.toon .acc { fill: var(--accent); }
.toon .blush { fill: var(--accent); fill-opacity: .45; }
.toon .dot { fill: var(--ink); }
.toon .orbit { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 6; fill: none; }
.toon .land { fill: var(--rule); }
@media (prefers-reduced-motion: no-preference) {
  .toon .sat { animation: bob 4s ease-in-out infinite; transform-origin: 120px 80px; }
  .toon .twinkle { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .toon .twinkle:nth-of-type(2) { animation-delay: .9s; }
  .toon .twinkle:nth-of-type(3) { animation-delay: 1.8s; }
  .toon .spin { animation: spin 22s linear infinite; }
  .toon .moon { animation: moon 9s ease-in-out infinite; transform-origin: 120px 100px; }
  .toon .lift { animation: lift 3.2s ease-in-out infinite; }
  .toon .flame, .toon .flame-in { animation: flicker .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0; }
  .toon .bands path { stroke-dasharray: 14 6; animation: shimmer 1.6s linear infinite; }
  .toon .beam-in { stroke-dasharray: 14 6; animation: shimmer 1.6s linear infinite; }
  @keyframes spin { from { transform: translateX(0); } to { transform: translateX(-248px); } }
  @keyframes moon { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-150deg); } }
  @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes flicker { from { transform: scaleY(1); } to { transform: scaleY(.72); } }
  @keyframes shimmer { to { stroke-dashoffset: -40; } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-6px) rotate(-4deg); } }
  @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
}
@media (max-width: 620px) {
  .hero { grid-template-columns: auto 1fr; gap: 14px 20px; }
  .verse { grid-column: 1 / -1; order: 2; }
  .verse p { font-size: 17.5px; }
  .verse blockquote { gap: 4px; }
  main { gap: 18px; }
  nav .kind { font-size: 9px; }
  .question p { font-size: 15.5px; }
  .cal { justify-self: end; }
  .toon { width: 110px; }
}
nav ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; border-top: 1px solid var(--rule); }
nav li { border-bottom: 1px solid var(--rule); }
nav li:first-child { grid-column: 1 / -1; }
nav a {
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 16px;
  padding: 12px 0; color: inherit; text-decoration: none;
}
nav .kind { grid-column: 1 / -1; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
nav .name { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.1; }
nav .arrow { color: var(--accent); font-size: 18px; transition: transform .25s ease; }
nav .desc { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
nav a:hover .name { color: var(--accent); }
nav a:hover .arrow { transform: translate(3px, -3px); }
nav a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

.greet { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

@media (max-width: 620px) {
  nav ul { grid-template-columns: 1fr; }
  nav .name { font-size: 21px; }
  nav a { padding: 10px 0; }
  nav .desc { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .verse p { animation: rise .9s ease both; }
  .verse p + p { animation-delay: .25s; }
  @keyframes rise { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { nav .arrow { transition: none; } }
</style>

<script>
  // One question per day, same for everyone that day. Add or remove lines freely.
  const QUESTIONS = [
    "What value or principle do you try to live by every day?",
    "What is one thing you want to understand better by the end of this week?",
    "What would make today a good day, even if nothing else goes to plan?",
    "Which idea on your list excites you most right now, and why haven't you started it?",
    "What did you learn yesterday that you didn't know the day before?",
    "Who helped you recently, and have you told them?",
    "What problem would you work on if you knew you couldn't fail?",
    "What are you avoiding, and what is the smallest first step?",
    "What does doing your best work look like today?",
    "Which assumption in your current work deserves a second look?",
    "What would you tell yourself from a year ago?",
    "What are you grateful for this morning?",
    "What is one thing you can make simpler today?",
    "Where do you want to be in five years, and does today move you closer?",
    "What question would you most like answered by your research?",
    "What drains your energy, and what restores it?",
    "What is one habit you want to keep, and one you want to drop?",
    "Who do you admire, and what quality of theirs do you want to practise?",
    "What would you build if you had a free week?",
    "What does success mean to you, in your own words?",
    "What is something you changed your mind about recently?",
    "How can you help someone on your team today?",
    "What paper or idea has stayed with you the longest, and why?",
    "What small win from this week are you proud of?",
    "What do you want people to say about your work?",
    "What are you curious about that has nothing to do with work?",
    "If today had only one priority, what would it be?",
    "What scares you a little but would be worth trying?",
    "What did you do this week just for joy?",
    "What kind of impact do you want your work to have on the planet?"
  ];
  try {
    const tz = "Asia/Kolkata";
    const now = new Date();
    const iso = new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(now);
    const day = Math.floor(Date.parse(iso + "T00:00:00Z") / 86400000);
    document.getElementById("question").textContent = QUESTIONS[day % QUESTIONS.length];
    // Calendar: month view, Monday first, today circled.
    const [ty, tm, td] = iso.split("-").map(Number);
    let viewY = ty, viewM = tm - 1;
    const dowEl = document.getElementById("cal-dow");
    dowEl.innerHTML = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map(d => `<span>${d}</span>`).join("");
    function drawCal() {
      const first = new Date(Date.UTC(viewY, viewM, 1));
      const lead = (first.getUTCDay() + 6) % 7;
      const start = new Date(Date.UTC(viewY, viewM, 1 - lead));
      document.getElementById("cal-title").textContent =
        first.toLocaleDateString("en-GB", { month: "long", year: "numeric", timeZone: "UTC" });
      let cells = "";
      for (let i = 0; i < 42; i++) {
        const c = new Date(start.getTime() + i * 86400000);
        const y = c.getUTCFullYear(), m = c.getUTCMonth(), dd = c.getUTCDate(), wd = (c.getUTCDay() + 6) % 7;
        const cls = [m !== viewM ? "out" : "", wd >= 5 ? "we" : "", y === ty && m === tm - 1 && dd === td ? "today" : ""].filter(Boolean).join(" ");
        const label = c.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
        cells += `<span role="gridcell" class="${cls}" aria-label="${label}"${cls.includes("today") ? ' aria-current="date"' : ""}>${dd}</span>`;
        if (i === 34 && new Date(start.getTime() + 35 * 86400000).getUTCMonth() !== viewM) break;
      }
      document.getElementById("cal-days").innerHTML = cells;
      document.getElementById("cal-today").hidden = viewY === ty && viewM === tm - 1;
    }
    function shift(n) { viewM += n; if (viewM < 0) { viewM = 11; viewY--; } if (viewM > 11) { viewM = 0; viewY++; } drawCal(); }
    document.getElementById("cal-prev").addEventListener("click", () => shift(-1));
    document.getElementById("cal-next").addEventListener("click", () => shift(1));
    document.getElementById("cal-today").addEventListener("click", () => { viewY = ty; viewM = tm - 1; drawCal(); });
    drawCal();

    // A different friend each day; tap to meet the next one.
    const toons = [...document.querySelectorAll("[data-toon]")];
    let current = day % toons.length;
    const showToon = i => toons.forEach((t, j) => { t.hidden = j !== i; });
    showToon(current);
    document.getElementById("toon-btn").addEventListener("click", () => {
      current = (current + 1) % toons.length;
      showToon(current);
    });
    const hour = Number(new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "numeric", hourCycle: "h23" }).format(now));
    const part = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    document.getElementById("foot").textContent = part;
  } catch (e) {}
</script>
</body>
</html>
